name: graphcrud-external

services:
  graphcrud:
    image: graphcrud:0.1.0@sha256:f9040ea692b1d0f3896d02aa04729fa4693d7627aba8816a2696bc54bfe0f604
    pull_policy: never
    environment:
      GRAPHCRUD_BOLT_URI: ${GRAPHCRUD_BOLT_URI:?set the approved external GraphStore Bolt URI}
      GRAPHCRUD_BOLT_USER: ${GRAPHCRUD_BOLT_USER:?set the external GraphStore user}
      GRAPHCRUD_BOLT_PASSWORD: ${GRAPHCRUD_BOLT_PASSWORD:?set the external GraphStore password}
      GRAPHCRUD_SOURCE_ROOT: /workspace
    volumes:
      - ${GRAPHCRUD_SOURCE_ROOT:?set GRAPHCRUD_SOURCE_ROOT}:/workspace:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 2g
    cpus: 2.0
